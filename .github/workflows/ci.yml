name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          - python: "3.10"
            deps: oldest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - if: matrix.deps == 'oldest'
        run: pip install "langchain-core>=0.3,<0.4" "langgraph>=0.2,<0.3" "langchain-tests>=0.3,<0.4"
      - run: ruff check .
      - run: pytest -q tests/unit_tests
