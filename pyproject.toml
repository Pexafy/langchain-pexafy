[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-pexafy"
version = "0.1.1"
description = "LangChain tools for Pexafy: semantic search over 9M+ free stock photos from Unsplash, Pexels, Pixabay and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Marouane Tijani", email = "marouane@pexafy.com"}]
keywords = ["langchain", "langgraph", "agents", "tools", "stock photos", "image search", "semantic search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["langchain-core>=0.3.0,<2", "pexafy>=0.1.2,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20", "langchain-tests>=0.3", "langgraph>=0.2", "ruff>=0.5"]

[project.urls]
Homepage = "https://pexafy.com"
Documentation = "https://docs.pexafy.com/langchain"
Source = "https://github.com/Pexafy/langchain-pexafy"
Issues = "https://github.com/Pexafy/langchain-pexafy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_pexafy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
